name: Regression suite

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (resolved with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`); the trailing comment names
# the release so Dependabot can propose updates.
jobs:
  lint-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch, project and lint tooling
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . 'ruff==0.15.16'

      - name: Start an agent from the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from synapse.agent import IntegratedAgent
          from synapse.config import SynapseConfig, tidal_checkpoint_path
          from synapse.frontier.spec import MODULE_IDS

          assert tidal_checkpoint_path().is_file()
          assert len(MODULE_IDS) == 18
          IntegratedAgent(SynapseConfig(nodes_per_source=16))
          PY

      - name: Ruff lint check
        run: ruff check synapse tests scripts

      - name: JavaScript syntax check
        run: node --check synapse/web/app.js

      - name: Pre-NEUROWEAVE compatibility manifest check
        run: python scripts/neuroweave_compat_manifest.py --check

      - name: Pre-Frontier compatibility manifest check
        run: >-
          python scripts/neuroweave_compat_manifest.py
          --manifest docs/compatibility/manifest-pre-frontier.json
          --baseline-tag sonapse-pre-frontier-baseline
          --check

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # torch 2.11.0+cpu manylinux_2_28_x86_64 wheels exist for cp310, cp312 and cp313
        # (https://download.pytorch.org/whl/cpu/torch/, checked 2026-11-20).
        python-version: ['3.10', '3.12', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: python -m pip install -e '.[test,connectomes,yaml]'

      - name: Install NIR for the interchange round-trip test
        if: matrix.python-version == '3.12'
        run: python -m pip install 'nir==1.0.8' 'h5py==3.14.0'

      - name: Run full regression suite
        run: python -m pytest -q --junitxml=pytest-results-${{ matrix.python-version }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
